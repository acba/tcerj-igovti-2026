  - auditado: CGE
    secao: "2"
    codigo: q2203
    identidade_parecer: 408b8c241d604571c90b249dff296b6baedc3edf26073bb6e20a79d133c20c51
    decisao: parcialmente acolhida
    manifestacao_equipe: >-
      A reavaliação foi parcialmente acolhida. A organização apresentou como
      evidência os inventários de ativos e servidores, os registros extraídos
      do GLPI e os elementos de monitoramento da infraestrutura. A documentação
      é insuficiente para demonstrar integralmente a implementação do processo
      de gestão de configuração e ativos, pois comprova a execução da gestão de
      ativos e a manutenção de base atualizada com configurações e relações
      entre ativos e serviços, mas não comprova que essa base seja utilizada
      como insumo para o planejamento e o acompanhamento das mudanças. Assim,
      os itens q2203 e q2203ext[A] passam a ser considerados conformes, enquanto
      o item q2203ext[B] permanece não conforme.
