meta:
  nome: igovti_2026_achados_binario_v1
  questionario: igovti_2026.md
  versao: v1
  fonte_criterios: Questões do questionário iGovTI 2026 e ações de verificação da matriz de procedimentos.
regra_comum:
  conformidade:
  - A evidência sustenta diretamente o item afirmado.
  - A evidência contém elemento verificável citável, como trecho, página, aba, linha, imagem, ato, ata, relatório, registro ou equivalente.
  nao_conformidade:
  - Declaração isolada do respondente.
  - Arquivo sem conteúdo útil para o item afirmado.
  - Evidência de outra organização.
prompts:
- arquivo: q0101.md
  coluna_evidencia: q0101evi
  excluir_regra_comum_conformidade:
  - A evidência sustenta diretamente o item afirmado.
  itens_avaliaveis:
  - "q0101[A]"
  - "q0101[B]"
  - "q0101[C]"
  - "q0101[D]"
  - "q0101[E]"
  criterios_por_item:
    q0101[A]:
    - Comprova área, unidade, setor ou função de TI formalmente instituída na organização.
    # - Comprova que essa estrutura atende a organização de forma centralizada.
    # - Comprova que a equipe técnica própria é predominante na execução dos serviços de TI.
    q0101[B]:
    - Comprova área, unidade, setor ou função de TI formalmente instituída na organização.
    # - Comprova que essa estrutura central faz a gestão dos serviços de TI.
    # - Comprova que a execução operacional ou técnica é predominantemente terceirizada.
    q0101[C]:
    - Comprova área, unidade, setor ou função de TI formalmente instituída na organização.
    - Comprova que os serviços de TI são prestados predominantemente por órgão, entidade ou estrutura central externa à organização.
    # - Comprova o vínculo formal entre a organização auditada e a estrutura externa prestadora dos serviços de TI.
    q0101[D]:
    - Comprova áreas, unidades, setores ou funções de TI formalmente instituídas no ente/organização.
    # - Comprova que diferentes secretarias, unidades ou setores possuem autonomia para manter equipes, contratos ou infraestruturas de TI.
    # - Comprova que esse modelo descentralizado é predominante na organização.
    q0101[E]:
    - Comprova a existência de TI central formal para diretrizes ou infraestrutura corporativa.
    # - Comprova que áreas de negócio possuem equipes, contratos ou estruturas próprias para sustentar sistemas ou serviços específicos.
