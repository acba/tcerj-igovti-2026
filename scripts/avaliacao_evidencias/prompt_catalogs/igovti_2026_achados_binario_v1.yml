    q0102[B]:
    - Comprova que a área de TI se reporta diretamente ao dirigente máximo da organização (Secretário, Prefeito, Presidente, Diretor-Presidente, Conselheiro-Presidente etc).
    # - Comprova que a área de TI está subordinada a secretaria, subsecretaria, diretoria-geral ou estrutura equivalente de nível estratégico.
    q0102[C]:
    - Comprova que a área de TI se reporta diretamente ao dirigente máximo da organização (Secretário, Prefeito, Presidente, Diretor-Presidente, Conselheiro-Presidente etc).
    # - Comprova que a área de TI está subordinada a área administrativa, financeira ou área meio equivalente.
    q0102[D]:
    - Comprova que a área de TI se reporta diretamente ao dirigente máximo da organização (Secretário, Prefeito, Presidente, Diretor-Presidente, Conselheiro-Presidente etc).
    # - Comprova que a área de TI está subordinada a unidade operacional ou setorial sem atuação corporativa relevante.
