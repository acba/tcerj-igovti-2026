<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 920" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="hub" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="gGovernanca" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="gGestao" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000" flood-opacity="0.3"/>
    </filter>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="920" fill="url(#bg)"/>

  <text x="600" y="42" text-anchor="middle" fill="#e2e8f0" font-size="26" font-weight="700" letter-spacing="1">iGovTI 2026</text>
  <text x="600" y="66" text-anchor="middle" fill="#94a3b8" font-size="13">ndice de Governança e Gestão de Tecnologia da Informação — TCE-RJ</text>

  <line x1="600" y1="82" x2="600" y2="108" stroke="#334155" stroke-width="2" stroke-dasharray="4,3"/>

  <!-- HUB CENTRAL -->
  <rect x="480" y="108" width="240" height="56" rx="28" fill="url(#hub)" filter="url(#glow)"/>
  <text x="600" y="133" text-anchor="middle" fill="#fff" font-size="15" font-weight="700">iGovTI</text>
  <text x="600" y="150" text-anchor="middle" fill="#bfdbfe" font-size="11">2 Componentes Principais</text>

  <!-- CONECTORES HUB -> COMPONENTES -->
  <line x1="540" y1="164" x2="300" y2="210" stroke="#8b5cf6" stroke-width="2" opacity="0.6"/>
  <line x1="660" y1="164" x2="900" y2="210" stroke="#10b981" stroke-width="2" opacity="0.6"/>

  <!-- ========== COMPONENTE 1: GOVERNANCA TI ========== -->
  <rect x="180" y="210" width="240" height="50" rx="12" fill="url(#gGovernanca)" filter="url(#shadow)"/>
  <text x="300" y="232" text-anchor="middle" fill="#fff" font-size="13" font-weight="700">Governança de TI</text>
  <text x="300" y="249" text-anchor="middle" fill="#ede9fe" font-size="10">47,8% do iGovTI</text>

  <rect x="180" y="275" width="240" height="180" rx="10" fill="#1a0f2e" stroke="#8b5cf6" stroke-width="1" opacity="0.9"/>
  <text x="195" y="296" fill="#c4b5fd" font-size="11" font-weight="600">4 questões</text>
  <line x1="195" y1="304" x2="405" y2="304" stroke="#4c1d95" stroke-width="1"/>

  <text x="195" y="322" fill="#cbd5e1" font-size="10">• q1001: Modelo de gestão de TI</text>
  <text x="380" y="322" fill="#a78bfa" font-size="9" text-anchor="end">32,7%</text>

  <text x="195" y="348" fill="#cbd5e1" font-size="10">• q1002: Monitoramento de desempenho</text>
  <text x="380" y="348" fill="#a78bfa" font-size="9" text-anchor="end">27,6%</text>

  <text x="195" y="374" fill="#cbd5e1" font-size="10">• q1003: Serviços de auditoria interna</text>
  <text x="380" y="374" fill="#a78bfa" font-size="9" text-anchor="end">15,4%</text>

  <text x="195" y="400" fill="#cbd5e1" font-size="10">• q1004: Simplificação de serviços</text>
  <text x="380" y="400" fill="#a78bfa" font-size="9" text-anchor="end">24,3%</text>

  <text x="300" y="440" text-anchor="middle" fill="#a78bfa" font-size="9" font-style="italic">Direcionamento e supervisão estratégica</text>

  <!-- ========== COMPONENTE 2: iGestTI ========== -->
  <rect x="480" y="210" width="540" height="50" rx="12" fill="url(#gGestao)" filter="url(#shadow)"/>
  <text x="750" y="232" text-anchor="middle" fill="#fff" font-size="13" font-weight="700">iGestTI — Gestão de TI</text>
  <text x="750" y="249" text-anchor="middle" fill="#d1fae5" font-size="10">52,2% do iGovTI</text>

  <!-- Sub-grupos do iGestTI - grid organizado -->
  <!-- Linha 1 -->
  <rect x="480" y="275" width="260" height="95" rx="8" fill="#0a2519" stroke="#10b981" stroke-width="1" opacity="0.9"/>
  <text x="490" y="294" fill="#6ee7b7" font-size="10" font-weight="600">Planejamento de TI</text>
  <text x="720" y="294" fill="#34d399" font-size="9" text-anchor="end">15,3%</text>
  <line x1="490" y1="302" x2="730" y2="302" stroke="#064e3b" stroke-width="1"/>
  <text x="490" y="318" fill="#cbd5e1" font-size="9">• q2101: Processo de planejamento</text>
  <text x="720" y="318" fill="#94a3b8" font-size="8" text-anchor="end">50,2%</text>
  <text x="490" y="334" fill="#cbd5e1" font-size="9">• q2102: Plano de TI vigente</text>
  <text x="720" y="334" fill="#94a3b8" font-size="8" text-anchor="end">49,8%</text>
  <text x="490" y="356" fill="#6ee7b7" font-size="8" font-style="italic">Processo formal e plano aprovado</text>

  <rect x="760" y="275" width="260" height="95" rx="8" fill="#0a2519" stroke="#10b981" stroke-width="1" opacity="0.9"/>
  <text x="770" y="294" fill="#6ee7b7" font-size="10" font-weight="600">Gestão de Serviços</text>
  <text x="1000" y="294" fill="#34d399" font-size="9" text-anchor="end">18,5%</text>
  <line x1="770" y1="302" x2="1010" y2="302" stroke="#064e3b" stroke-width="1"/>
  <text x="770" y="318" fill="#cbd5e1" font-size="9">• q2201: Catálogo e níveis de serviço</text>
  <text x="1000" y="318" fill="#94a3b8" font-size="8" text-anchor="end">24,4%</text>
  <text x="770" y="334" fill="#cbd5e1" font-size="9">• q2202: Gestão de mudanças</text>
  <text x="1000" y="334" fill="#94a3b8" font-size="8" text-anchor="end">24,1%</text>
  <text x="770" y="350" fill="#cbd5e1" font-size="9">• q2203: Configuração e ativos</text>
  <text x="1000" y="350" fill="#94a3b8" font-size="8" text-anchor="end">26,2%</text>
  <text x="770" y="366" fill="#cbd5e1" font-size="9">• q2204: Gestão de incidentes</text>
  <text x="1000" y="366" fill="#94a3b8" font-size="8" text-anchor="end">25,3%</text>

  <!-- Linha 2 -->
  <rect x="480" y="385" width="260" height="95" rx="8" fill="#0a2519" stroke="#10b981" stroke-width="1" opacity="0.9"/>
  <text x="490" y="404" fill="#6ee7b7" font-size="10" font-weight="600">Riscos e Continuidade</text>
  <text x="720" y="404" fill="#34d399" font-size="9" text-anchor="end">16,3%</text>
  <line x1="490" y1="412" x2="730" y2="412" stroke="#064e3b" stroke-width="1"/>
