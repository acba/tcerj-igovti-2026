  <text x="720" y="444" fill="#94a3b8" font-size="8" text-anchor="end">33,5%</text>
  <text x="490" y="460" fill="#cbd5e1" font-size="9">• q2303: Continuidade de serviços</text>
  <text x="720" y="460" fill="#94a3b8" font-size="8" text-anchor="end">35,2%</text>

  <rect x="760" y="385" width="260" height="95" rx="8" fill="#0a2519" stroke="#10b981" stroke-width="1" opacity="0.9"/>
  <text x="770" y="404" fill="#6ee7b7" font-size="10" font-weight="600">Estrutura de Seg. da Info.</text>
  <text x="1000" y="404" fill="#34d399" font-size="9" text-anchor="end">15,8%</text>
  <line x1="770" y1="412" x2="1010" y2="412" stroke="#064e3b" stroke-width="1"/>
  <text x="770" y="428" fill="#cbd5e1" font-size="9">• q2401: Política de segurança</text>
  <text x="1000" y="428" fill="#94a3b8" font-size="8" text-anchor="end">35,3%</text>
  <text x="770" y="444" fill="#cbd5e1" font-size="9">• q2402: Comitê de segurança</text>
  <text x="1000" y="444" fill="#94a3b8" font-size="8" text-anchor="end">31,4%</text>
  <text x="770" y="460" fill="#cbd5e1" font-size="9">• q2403: Gestor institucional</text>
  <text x="1000" y="460" fill="#94a3b8" font-size="8" text-anchor="end">33,3%</text>

  <!-- Linha 3 -->
  <rect x="480" y="495" width="260" height="115" rx="8" fill="#0a2519" stroke="#10b981" stroke-width="1" opacity="0.9"/>
  <text x="490" y="514" fill="#6ee7b7" font-size="10" font-weight="600">Processos de Seg. da Info.</text>
  <text x="720" y="514" fill="#34d399" font-size="9" text-anchor="end">18,2%</text>
  <line x1="490" y1="522" x2="730" y2="522" stroke="#064e3b" stroke-width="1"/>
  <text x="490" y="538" fill="#cbd5e1" font-size="9">• q2501: Gestão de ativos</text>
  <text x="590" y="538" fill="#94a3b8" font-size="8">(via TCU)</text>
  <text x="490" y="554" fill="#cbd5e1" font-size="9">• q2502: Controle de acesso</text>
  <text x="720" y="554" fill="#94a3b8" font-size="8" text-anchor="end">83,3%</text>
  <text x="490" y="570" fill="#cbd5e1" font-size="9">• q2503: Classificação de informações</text>
  <text x="720" y="570" fill="#94a3b8" font-size="8" text-anchor="end">30,1%</text>
  <text x="490" y="586" fill="#cbd5e1" font-size="9">• q2504: Proteção de recursos</text>
  <text x="720" y="586" fill="#94a3b8" font-size="8" text-anchor="end">32,3%</text>
  <text x="490" y="604" fill="#6ee7b7" font-size="8" font-style="italic">Inclui CIS Controls (TCU)</text>

  <rect x="760" y="495" width="260" height="115" rx="8" fill="#0a2519" stroke="#10b981" stroke-width="1" opacity="0.9"/>
  <text x="770" y="514" fill="#6ee7b7" font-size="10" font-weight="600">Gestão de Soluções</text>
  <text x="1000" y="514" fill="#34d399" font-size="9" text-anchor="end">15,8%</text>
  <line x1="770" y1="522" x2="1010" y2="522" stroke="#064e3b" stroke-width="1"/>
  <text x="770" y="538" fill="#cbd5e1" font-size="9">• q2601: Processo de software</text>
  <text x="1000" y="538" fill="#94a3b8" font-size="8" text-anchor="end">50,9%</text>
  <text x="770" y="554" fill="#cbd5e1" font-size="9">• q2602: Gestão de projetos de TI</text>
  <text x="1000" y="554" fill="#94a3b8" font-size="8" text-anchor="end">49,1%</text>
  <text x="770" y="576" fill="#6ee7b7" font-size="8" font-style="italic">Desenvolvimento, aquisição e</text>
  <text x="770" y="590" fill="#6ee7b7" font-size="8" font-style="italic">gestão de soluções tecnológicas</text>

  <!-- Total iGestTI -->
  <text x="750" y="635" text-anchor="middle" fill="#34d399" font-size="11" font-weight="600">6 subgrupos · 16 questões ponderadas</text>

  <!-- ========== SECAO INFERIOR: DETALHAMENTO ========== -->
  <line x1="50" y1="660" x2="1150" y2="660" stroke="#334155" stroke-width="1"/>
  <text x="600" y="686" text-anchor="middle" fill="#e2e8f0" font-size="16" font-weight="700">Composição do Índice iGovTI</text>

  <!-- 2 cards principais -->
  <!-- Card Governanca -->
  <rect x="200" y="702" width="360" height="90" rx="10" fill="#2e1065" opacity="0.4"/>
  <circle cx="240" cy="747" r="22" fill="#8b5cf6" opacity="0.8"/>
  <text x="240" y="752" text-anchor="middle" fill="#fff" font-size="16" font-weight="700">1</text>
  <text x="275" y="732" fill="#c4b5fd" font-size="12" font-weight="600">Governança de TI</text>
  <text x="275" y="750" fill="#94a3b8" font-size="9">47,8% do peso total</text>
  <text x="275" y="766" fill="#94a3b8" font-size="9">Direcionamento estratégico, comitê, indicadores,</text>
  <text x="275" y="780" fill="#94a3b8" font-size="9">auditoria interna e simplificação de serviços</text>

  <!-- Card Gestao -->
  <rect x="640" y="702" width="360" height="90" rx="10" fill="#064e3b" opacity="0.4"/>
  <circle cx="680" cy="747" r="22" fill="#10b981" opacity="0.8"/>
  <text x="680" y="752" text-anchor="middle" fill="#fff" font-size="16" font-weight="700">2</text>
  <text x="715" y="732" fill="#6ee7b7" font-size="12" font-weight="600">iGestTI — Gestão de TI</text>
  <text x="715" y="750" fill="#94a3b8" font-size="9">52,2% do peso total</text>
  <text x="715" y="766" fill="#94a3b8" font-size="9">Planejamento, serviços, riscos, segurança da</text>
  <text x="715" y="780" fill="#94a3b8" font-size="9">informação, soluções e projetos</text>

  <!-- Niveis de maturidade -->
  <rect x="50" y="810" width="1100" height="95" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="600" y="832" text-anchor="middle" fill="#e2e8f0" font-size="12" font-weight="600">NÍVEIS DE MATURIDADE</text>

  <rect x="80" y="845" width="180" height="40" rx="6" fill="#dc2626" opacity="0.2" stroke="#dc2626" stroke-width="1"/>
  <text x="170" y="862" text-anchor="middle" fill="#fca5a5" font-size="10" font-weight="600">Inexpressivo</text>
  <text x="170" y="876" text-anchor="middle" fill="#94a3b8" font-size="8">0,00 – 0,15</text>

  <rect x="280" y="845" width="180" height="40" rx="6" fill="#f59e0b" opacity="0.2" stroke="#f59e0b" stroke-width="1"/>
  <text x="370" y="862" text-anchor="middle" fill="#fcd34d" font-size="10" font-weight="600">Iniciando</text>
  <text x="370" y="876" text-anchor="middle" fill="#94a3b8" font-size="8">0,15 – 0,40</text>

  <rect x="480" y="845" width="180" height="40" rx="6" fill="#3b82f6" opacity="0.2" stroke="#3b82f6" stroke-width="1"/>
  <text x="570" y="862" text-anchor="middle" fill="#93c5fd" font-size="10" font-weight="600">Intermediário</text>
  <text x="570" y="876" text-anchor="middle" fill="#94a3b8" font-size="8">0,40 – 0,70</text>

  <rect x="680" y="845" width="180" height="40" rx="6" fill="#10b981" opacity="0.2" stroke="#10b981" stroke-width="1"/>
  <text x="770" y="862" text-anchor="middle" fill="#6ee7b7" font-size="10" font-weight="600">Aprimorado</text>
  <text x="770" y="876" text-anchor="middle" fill="#94a3b8" font-size="8">0,70 – 1,00</text>

  <rect x="880" y="845" width="240" height="40" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1"/>
  <text x="1000" y="862" text-anchor="middle" fill="#cbd5e1" font-size="9" font-weight="600">Escala de Adoção</text>
  <text x="1000" y="876" text-anchor="middle" fill="#94a3b8" font-size="8">0 (não adota) a 1 (adota totalmente)</text>

</svg>
