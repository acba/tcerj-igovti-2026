<svg xmlns="http://www.w3.org/2000/svg" width="900" height="650" viewBox="0 0 900 650" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <style>
      .box { rx:6; stroke-width:1.5; }
      .text { font-size:12px; font-weight:bold; fill:#1a1a1a; }
      .subtext { font-size:10px; fill:#333; }
      .pct { font-size:10px; fill:#555; font-weight:bold; }
      .quest { font-size:11px; font-weight:bold; fill:#1a1a1a; }
      .line { stroke:#888; stroke-width:1.5; fill:none; }
      .dash { stroke:#bbb; stroke-width:1; stroke-dasharray:4,3; fill:none; }
      .title { font-size:22px; font-weight:bold; fill:#003366; }
    </style>
  </defs>

  <!-- Fundo -->
  <rect width="900" height="650" fill="#f8f9fa" rx="10"/>

  <!-- Título -->
  <text x="450" y="35" text-anchor="middle" class="title">Composição do iGovTI 2026</text>
  <text x="450" y="55" text-anchor="middle" font-size="11" fill="#666">Governança + Gestão de TIC e suas questões de auditoria</text>

  <!-- Nível 0: iGovTI 2026 -->
  <rect x="350" y="70" width="200" height="40" class="box" fill="#003366" stroke="#002244"/>
  <text x="450" y="90" text-anchor="middle" fill="#fff" font-size="14" font-weight="bold">iGovTI 2026</text>
  <text x="450" y="105" text-anchor="middle" fill="#e0e0e0" font-size="10">Índice composto (0 a 1)</text>

  <!-- Linhas para Nível 1 -->
  <line x1="450" y1="110" x2="450" y2="125" class="line"/>
  <line x1="220" y1="125" x2="680" y2="125" class="line"/>
  <line x1="220" y1="125" x2="220" y2="140" class="line"/>
  <line x1="680" y1="125" x2="680" y2="140" class="line"/>

  <!-- Nível 1: Governança de TIC -->
  <rect x="120" y="140" width="200" height="45" class="box" fill="#2E5D94" stroke="#1a3a5c"/>
  <text x="220" y="160" text-anchor="middle" fill="#fff" font-size="13" font-weight="bold">Governança de TIC</text>
  <text x="220" y="177" text-anchor="middle" class="pct" fill="#e0e0e0">Peso: 47,77%</text>

  <!-- Nível 1: Gestão de TIC (iGestTI) -->
  <rect x="580" y="140" width="200" height="45" class="box" fill="#4A7C59" stroke="#2e4d35"/>
  <text x="680" y="160" text-anchor="middle" fill="#fff" font-size="13" font-weight="bold">Gestão de TIC (iGestTI)</text>
  <text x="680" y="177" text-anchor="middle" class="pct" fill="#e0e0e0">Peso: 52,23%</text>

  <!-- Linhas para Nível 2 (Governança - 4 componentes) -->
  <line x1="220" y1="185" x2="220" y2="200" class="line"/>
  <line x1="60"  y1="200" x2="380" y2="200" class="line"/>
  <line x1="60"  y1="200" x2="60"  y2="215" class="line"/>
  <line x1="153" y1="200" x2="153" y2="215" class="line"/>
  <line x1="247" y1="200" x2="247" y2="215" class="line"/>
  <line x1="340" y1="200" x2="340" y2="215" class="line"/>

  <!-- Nível 2: Governança componentes -->
  <rect x="10"  y="215" width="100" height="45" class="box" fill="#D6E4F0" stroke="#2E5D94"/>
  <text x="60"  y="233" text-anchor="middle" class="subtext">Modelo de gestão</text>
  <text x="60"  y="248" text-anchor="middle" class="pct" fill="#2E5D94">q1001 (32,74%)</text>

  <rect x="103" y="215" width="100" height="45" class="box" fill="#D6E4F0" stroke="#2E5D94"/>
  <text x="153" y="233" text-anchor="middle" class="subtext">Monitoramento</text>
  <text x="153" y="248" text-anchor="middle" class="pct" fill="#2E5D94">q1002 (27,57%)</text>

  <rect x="197" y="215" width="100" height="45" class="box" fill="#D6E4F0" stroke="#2E5D94"/>
  <text x="247" y="233" text-anchor="middle" class="subtext">Auditoria interna</text>
  <text x="247" y="248" text-anchor="middle" class="pct" fill="#2E5D94">q1003 (15,36%)</text>

  <rect x="290" y="215" width="100" height="45" class="box" fill="#D6E4F0" stroke="#2E5D94"/>
  <text x="340" y="233" text-anchor="middle" class="subtext">Simplificação</text>
  <text x="340" y="248" text-anchor="middle" class="pct" fill="#2E5D94">q1004 (24,33%)</text>

  <!-- Linhas para Nível 2 (Gestão - 6 dimensões) -->
  <line x1="680" y1="185" x2="680" y2="200" class="line"/>
  <line x1="490" y1="200" x2="870" y2="200" class="line"/>
  <line x1="490" y1="200" x2="490" y2="215" class="line"/>
  <line x1="567" y1="200" x2="567" y2="215" class="line"/>
  <line x1="643" y1="200" x2="643" y2="215" class="line"/>
  <line x1="720" y1="200" x2="720" y2="215" class="line"/>
  <line x1="796" y1="200" x2="796" y2="215" class="line"/>
  <line x1="870" y1="200" x2="870" y2="215" class="line"/>

  <!-- Nível 2: Gestão dimensões -->
  <rect x="450" y="215" width="80" height="45" class="box" fill="#D8E8D8" stroke="#4A7C59"/>
  <text x="490" y="233" text-anchor="middle" class="subtext">Planejamento</text>
  <text x="490" y="248" text-anchor="middle" class="pct" fill="#4A7C59">15,34%</text>

  <rect x="527" y="215" width="80" height="45" class="box" fill="#D8E8D8" stroke="#4A7C59"/>
  <text x="567" y="233" text-anchor="middle" class="subtext">Serviços</text>
  <text x="567" y="248" text-anchor="middle" class="pct" fill="#4A7C59">18,52%</text>

  <rect x="603" y="215" width="80" height="45" class="box" fill="#D8E8D8" stroke="#4A7C59"/>
  <text x="643" y="233" text-anchor="middle" class="subtext">Riscos / SI</text>
  <text x="643" y="248" text-anchor="middle" class="pct" fill="#4A7C59">16,32%</text>

  <rect x="680" y="215" width="80" height="45" class="box" fill="#D8E8D8" stroke="#4A7C59"/>
  <text x="720" y="233" text-anchor="middle" class="subtext">Estrutura SI</text>
  <text x="720" y="248" text-anchor="middle" class="pct" fill="#4A7C59">15,78%</text>

  <rect x="756" y="215" width="80" height="45" class="box" fill="#D8E8D8" stroke="#4A7C59"/>
  <text x="796" y="233" text-anchor="middle" class="subtext">Processo SI</text>
  <text x="796" y="248" text-anchor="middle" class="pct" fill="#4A7C59">18,21%</text>

  <rect x="830" y="215" width="80" height="45" class="box" fill="#D8E8D8" stroke="#4A7C59"/>
  <text x="870" y="233" text-anchor="middle" class="subtext">Soluções TI</text>
  <text x="870" y="248" text-anchor="middle" class="pct" fill="#4A7C59">15,83%</text>

  <!-- Caixa de Questões de Auditoria -->
  <rect x="10" y="290" width="880" height="340" class="box" fill="#fff" stroke="#ccc" rx="8"/>
  <text x="450" y="315" text-anchor="middle" font-size="15" font-weight="bold" fill="#003366">Questões de Auditoria Avaliadas Individualmente</text>
  <line x1="40" y1="325" x2="860" y2="325" stroke="#ddd" stroke-width="1"/>

  <!-- Q1: Estrutura de TIC -->
  <rect x="30" y="340" width="260" height="55" class="box" fill="#FFF8E7" stroke="#D4A017" rx="5"/>
  <text x="160" y="358" text-anchor="middle" class="quest" fill="#8B4513">Q1 — Estrutura de TIC</text>
  <text x="160" y="375" text-anchor="middle" font-size="10" fill="#555">Área formal, atribuições e posicionamento</text>
  <text x="160" y="388" text-anchor="middle" font-size="9" fill="#777">Relaciona-se: Governança (q1001) + Planejamento</text>
  <!-- Linha tracejada para Governança -->
  <line x1="160" y1="340" x2="160" y2="290" class="dash"/>
  <line x1="160" y1="290" x2="220" y2="290" class="dash"/>
  <line x1="220" y1="260" x2="220" y2="290" class="dash"/>

  <!-- Q2: Governança e Comitê -->
  <rect x="320" y="340" width="260" height="55" class="box" fill="#FFF8E7" stroke="#D4A017" rx="5"/>
  <text x="450" y="358" text-anchor="middle" class="quest" fill="#8B4513">Q2 — Governança e Comitê de TIC</text>
  <text x="450" y="375" text-anchor="middle" font-size="10" fill="#555">Modelo, indicadores, metas e atuação do comitê</text>
  <text x="450" y="388" text-anchor="middle" font-size="9" fill="#777">Relaciona-se: Governança (q1002–q1004)</text>
  <line x1="450" y1="340" x2="450" y2="290" class="dash"/>
  <line x1="450" y1="290" x2="220" y2="290" class="dash"/>
  <line x1="220" y1="260" x2="220" y2="290" class="dash"/>

  <!-- Q3: Planejamento de TIC -->
  <rect x="610" y="340" width="260" height="55" class="box" fill="#FFF8E7" stroke="#D4A017" rx="5"/>
  <text x="740" y="358" text-anchor="middle" class="quest" fill="#8B4513">Q3 — Planejamento de TIC</text>
  <text x="740" y="375" text-anchor="middle" font-size="10" fill="#555">Plano vigente, alinhamento e acompanhamento</text>
  <text x="740" y="388" text-anchor="middle" font-size="9" fill="#777">Relaciona-se: PlanejamentoTI (q2101–q2102)</text>
  <line x1="740" y1="340" x2="740" y2="290" class="dash"/>
  <line x1="740" y1="290" x2="680" y2="290" class="dash"/>
  <line x1="680" y1="260" x2="680" y2="290" class="dash"/>

  <!-- Q4: Capacidade Institucional e SI -->
  <rect x="30" y="420" width="260" height="55" class="box" fill="#FFF8E7" stroke="#D4A017" rx="5"/>
  <text x="160" y="438" text-anchor="middle" class="quest" fill="#8B4513">Q4 — Capacidade Institucional e SI</text>
  <text x="160" y="455" text-anchor="middle" font-size="10" fill="#555">Força de trabalho, perfis e competências</text>
  <text x="160" y="468" text-anchor="middle" font-size="9" fill="#777">Relaciona-se: EstruturaSI / ProcessoSI / RiscosSI</text>
  <line x1="160" y1="420" x2="160" y2="400" class="dash"/>
  <line x1="160" y1="400" x2="680" y2="400" class="dash"/>
  <line x1="680" y1="260" x2="680" y2="400" class="dash"/>

  <!-- Q5: Gestão de Serviços de TIC -->
  <rect x="320" y="420" width="260" height="55" class="box" fill="#FFF8E7" stroke="#D4A017" rx="5"/>
  <text x="450" y="438" text-anchor="middle" class="quest" fill="#8B4513">Q5 — Gestão de Serviços de TIC</text>
  <text x="450" y="455" text-anchor="middle" font-size="10" fill="#555">Catálogo, níveis de serviço, ativos e incidentes</text>
  <text x="450" y="468" text-anchor="middle" font-size="9" fill="#777">Relaciona-se: ServicosTI (q2201–q2204)</text>
  <line x1="450" y1="420" x2="450" y2="400" class="dash"/>
  <line x1="450" y1="400" x2="680" y2="400" class="dash"/>
  <line x1="680" y1="260" x2="680" y2="400" class="dash"/>

  <!-- Q6: Contratações de TIC -->
  <rect x="610" y="420" width="260" height="55" class="box" fill="#FFF8E7" stroke="#D4A017" rx="5"/>
  <text x="740" y="438" text-anchor="middle" class="quest" fill="#8B4513">Q6 — Contratações de TIC</text>
  <text x="740" y="455" text-anchor="middle" font-size="10" fill="#555">Fluxo, papéis, aprovação técnica e alinhamento</text>
  <text x="740" y="468" text-anchor="middle" font-size="9" fill="#777">Relaciona-se: SoluçõesTI (q2601–q2602) + Planejamento</text>
  <line x1="740" y1="420" x2="740" y2="400" class="dash"/>
  <line x1="740" y1="400" x2="680" y2="400" class="dash"/>
  <line x1="680" y1="260" x2="680" y2="400" class="dash"/>

  <!-- Rodapé explicativo -->
  <text x="450" y="515" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">Fórmula de agregação</text>
  <rect x="150" y="530" width="600" height="40" class="box" fill="#f0f4f8" stroke="#003366" rx="5"/>
  <text x="450" y="550" text-anchor="middle" font-size="12" fill="#003366" font-family="Courier New, monospace" font-weight="bold">
    iGovTI = 0,4777 × GovernancaTI + 0,5223 × iGestTI
  </text>
  <text x="450" y="570" text-anchor="middle" font-size="10" fill="#555">
    iGestTI = 0,1534×Planejamento + 0,1852×Serviços + 0,1632×Riscos/SI + 0,1578×EstruturaSI + 0,1821×ProcessoSI + 0,1583×SoluçõesTI
  </text>

  <!-- Níveis de maturidade -->
  <text x="450" y="600" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">Níveis de maturidade do iGovTI</text>
  <rect x="140" y="610" width="120" height="28" class="box" fill="#D32F2F" stroke="#b71c1c" rx="4"/>
  <text x="200" y="628" text-anchor="middle" fill="#fff" font-size="10" font-weight="bold">Inexpressivo (0–0,15)</text>
  <rect x="270" y="610" width="120" height="28" class="box" fill="#F57C00" stroke="#e65100" rx="4"/>
  <text x="330" y="628" text-anchor="middle" fill="#fff" font-size="10" font-weight="bold">Iniciando (0,15–0,40)</text>
  <rect x="400" y="610" width="120" height="28" class="box" fill="#FBC02D" stroke="#f9a825" rx="4"/>
  <text x="460" y="628" text-anchor="middle" fill="#1a1a1a" font-size="10" font-weight="bold">Intermediário (0,40–0,70)</text>
  <rect x="530" y="610" width="120" height="28" class="box" fill="#388E3C" stroke="#2e7d32" rx="4"/>
  <text x="590" y="628" text-anchor="middle" fill="#fff" font-size="10" font-weight="bold">Aprimorado (0,70–1,00)</text>

  <!-- Fonte -->
  <text x="450" y="645" text-anchor="middle" font-size="9" fill="#999">Fonte: estrutura de agregação do iGovTI 2026 — TCE-RJ Fiscalização 18/2026</text>
</svg>
