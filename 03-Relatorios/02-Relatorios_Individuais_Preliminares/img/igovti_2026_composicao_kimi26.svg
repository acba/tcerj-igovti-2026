<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <style>
      .box { rx:6; stroke-width:1.5; }
      .text { font-size:12px; font-weight:bold; fill:#1a1a1a; }
      .subtext { font-size:10px; fill:#333; }
      .pct { font-size:10px; fill:#555; font-weight:bold; }
      .quest { font-size:11px; font-weight:bold; fill:#1a1a1a; }
      .line { stroke:#888; stroke-width:1.5; fill:none; }
      .dash { stroke:#bbb; stroke-width:1; stroke-dasharray:4,3; fill:none; }
      .title { font-size:20px; font-weight:bold; fill:#003366; }
    </style>
  </defs>

  <!-- Fundo -->
  <rect width="900" height="520" fill="#f8f9fa" rx="10"/>

  <!-- Título -->
  <text x="450" y="32" text-anchor="middle" class="title">Composição do iGovTI 2026</text>
  <text x="450" y="50" text-anchor="middle" font-size="11" fill="#666">Governança e Gestão de TIC — Questões de Auditoria</text>

  <!-- Nível 0: iGovTI 2026 -->
  <rect x="350" y="65" width="200" height="36" class="box" fill="#003366" stroke="#002244" rx="6"/>
  <text x="450" y="82" text-anchor="middle" fill="#fff" font-size="13" font-weight="bold">iGovTI 2026</text>
  <text x="450" y="95" text-anchor="middle" fill="#e0e0e0" font-size="9">Índice composto (0 a 1)</text>

  <!-- Linhas para Nível 1 -->
  <line x1="450" y1="101" x2="450" y2="114" class="line"/>
  <line x1="220" y1="114" x2="680" y2="114" class="line"/>
  <line x1="220" y1="114" x2="220" y2="127" class="line"/>
  <line x1="680" y1="114" x2="680" y2="127" class="line"/>

  <!-- Nível 1: Governança de TIC -->
  <rect x="120" y="127" width="200" height="40" class="box" fill="#2E5D94" stroke="#1a3a5c" rx="6"/>
  <text x="220" y="144" text-anchor="middle" fill="#fff" font-size="12" font-weight="bold">Governança de TIC</text>
  <text x="220" y="158" text-anchor="middle" class="pct" fill="#e0e0e0">Peso: 47,77%</text>

  <!-- Nível 1: Gestão de TIC (iGestTI) -->
  <rect x="580" y="127" width="200" height="40" class="box" fill="#4A7C59" stroke="#2e4d35" rx="6"/>
  <text x="680" y="144" text-anchor="middle" fill="#fff" font-size="12" font-weight="bold">Gestão de TIC (iGestTI)</text>
  <text x="680" y="158" text-anchor="middle" class="pct" fill="#e0e0e0">Peso: 52,23%</text>

  <!-- Linhas para Nível 2 (Governança - 4 componentes) -->
  <line x1="220" y1="167" x2="220" y2="178" class="line"/>
  <line x1="60"  y1="178" x2="380" y2="178" class="line"/>
  <line x1="60"  y1="178" x2="60"  y2="190" class="line"/>
  <line x1="153" y1="178" x2="153" y2="190" class="line"/>
  <line x1="247" y1="178" x2="247" y2="190" class="line"/>
  <line x1="340" y1="178" x2="340" y2="190" class="line"/>

  <!-- Nível 2: Governança componentes -->
  <rect x="10"  y="190" width="100" height="40" class="box" fill="#D6E4F0" stroke="#2E5D94" rx="5"/>
  <text x="60"  y="205" text-anchor="middle" class="subtext">Modelo de gestão</text>
  <text x="60"  y="218" text-anchor="middle" class="pct" fill="#2E5D94">q1001 (32,74%)</text>

  <rect x="103" y="190" width="100" height="40" class="box" fill="#D6E4F0" stroke="#2E5D94" rx="5"/>
  <text x="153" y="205" text-anchor="middle" class="subtext">Monitoramento</text>
  <text x="153" y="218" text-anchor="middle" class="pct" fill="#2E5D94">q1002 (27,57%)</text>

  <rect x="197" y="190" width="100" height="40" class="box" fill="#D6E4F0" stroke="#2E5D94" rx="5"/>
  <text x="247" y="205" text-anchor="middle" class="subtext">Auditoria interna</text>
  <text x="247" y="218" text-anchor="middle" class="pct" fill="#2E5D94">q1003 (15,36%)</text>

  <rect x="290" y="190" width="100" height="40" class="box" fill="#D6E4F0" stroke="#2E5D94" rx="5"/>
  <text x="340" y="205" text-anchor="middle" class="subtext">Simplificação</text>
  <text x="340" y="218" text-anchor="middle" class="pct" fill="#2E5D94">q1004 (24,33%)</text>

  <!-- Linhas para Nível 2 (Gestão - 6 dimensões) -->
  <line x1="680" y1="167" x2="680" y2="178" class="line"/>
  <line x1="490" y1="178" x2="870" y2="178" class="line"/>
  <line x1="490" y1="178" x2="490" y2="190" class="line"/>
  <line x1="567" y1="178" x2="567" y2="190" class="line"/>
  <line x1="643" y1="178" x2="643" y2="190" class="line"/>
  <line x1="720" y1="178" x2="720" y2="190" class="line"/>
  <line x1="796" y1="178" x2="796" y2="190" class="line"/>
  <line x1="870" y1="178" x2="870" y2="190" class="line"/>

  <!-- Nível 2: Gestão dimensões -->
  <rect x="450" y="190" width="80" height="40" class="box" fill="#D8E8D8" stroke="#4A7C59" rx="5"/>
  <text x="490" y="205" text-anchor="middle" class="subtext">Planejamento</text>
  <text x="490" y="218" text-anchor="middle" class="pct" fill="#4A7C59">15,34%</text>

  <rect x="527" y="190" width="80" height="40" class="box" fill="#D8E8D8" stroke="#4A7C59" rx="5"/>
  <text x="567" y="205" text-anchor="middle" class="subtext">Serviços</text>
  <text x="567" y="218" text-anchor="middle" class="pct" fill="#4A7C59">18,52%</text>

  <rect x="603" y="190" width="80" height="40" class="box" fill="#D8E8D8" stroke="#4A7C59" rx="5"/>
  <text x="643" y="205" text-anchor="middle" class="subtext">Riscos / SI</text>
  <text x="643" y="218" text-anchor="middle" class="pct" fill="#4A7C59">16,32%</text>

  <rect x="680" y="190" width="80" height="40" class="box" fill="#D8E8D8" stroke="#4A7C59" rx="5"/>
  <text x="720" y="205" text-anchor="middle" class="subtext">Estrutura SI</text>
  <text x="720" y="218" text-anchor="middle" class="pct" fill="#4A7C59">15,78%</text>

  <rect x="756" y="190" width="80" height="40" class="box" fill="#D8E8D8" stroke="#4A7C59" rx="5"/>
  <text x="796" y="205" text-anchor="middle" class="subtext">Processo SI</text>
  <text x="796" y="218" text-anchor="middle" class="pct" fill="#4A7C59">18,21%</text>

  <rect x="830" y="190" width="80" height="40" class="box" fill="#D8E8D8" stroke="#4A7C59" rx="5"/>
  <text x="870" y="205" text-anchor="middle" class="subtext">Soluções TI</text>
  <text x="870" y="218" text-anchor="middle" class="pct" fill="#4A7C59">15,83%</text>

  <!-- Caixa de Questões de Auditoria -->
  <rect x="15" y="255" width="870" height="240" class="box" fill="#fff" stroke="#ccc" rx="8"/>
  <text x="450" y="275" text-anchor="middle" font-size="14" font-weight="bold" fill="#003366">Questões de Auditoria Avaliadas Individualmente</text>
  <line x1="35" y1="285" x2="865" y2="285" stroke="#ddd" stroke-width="1"/>

  <!-- Q1: Estrutura de TIC -->
  <rect x="30" y="300" width="260" height="50" class="box" fill="#FFF8E7" stroke="#D4A017" rx="5"/>
  <text x="160" y="316" text-anchor="middle" class="quest" fill="#8B4513">Q1 — Estrutura de TIC</text>
  <text x="160" y="330" text-anchor="middle" font-size="10" fill="#555">Área formal, atribuições e posicionamento</text>
  <text x="160" y="342" text-anchor="middle" font-size="9" fill="#777">Relaciona-se: Governança (q1001) + Planejamento</text>
  <!-- Linha tracejada para Governança -->
  <line x1="160" y1="300" x2="160" y2="255" class="dash"/>
  <line x1="160" y1="255" x2="220" y2="255" class="dash"/>
  <line x1="220" y1="230" x2="220" y2="255" class="dash"/>

  <!-- Q2: Governança e Comitê -->
  <rect x="320" y="300" width="260" height="50" class="box" fill="#FFF8E7" stroke="#D4A017" rx="5"/>
  <text x="450" y="316" text-anchor="middle" class="quest" fill="#8B4513">Q2 — Governança e Comitê de TIC</text>
  <text x="450" y="330" text-anchor="middle" font-size="10" fill="#555">Modelo, indicadores, metas e atuação do comitê</text>
  <text x="450" y="342" text-anchor="middle" font-size="9" fill="#777">Relaciona-se: Governança (q1002–q1004)</text>
  <line x1="450" y1="300" x2="450" y2="255" class="dash"/>
  <line x1="450" y1="255" x2="220" y2="255" class="dash"/>
  <line x1="220" y1="230" x2="220" y2="255" class="dash"/>

  <!-- Q3: Planejamento de TIC -->
  <rect x="610" y="300" width="260" height="50" class="box" fill="#FFF8E7" stroke="#D4A017" rx="5"/>
  <text x="740" y="316" text-anchor="middle" class="quest" fill="#8B4513">Q3 — Planejamento de TIC</text>
  <text x="740" y="330" text-anchor="middle" font-size="10" fill="#555">Plano vigente, alinhamento e acompanhamento</text>
  <text x="740" y="342" text-anchor="middle" font-size="9" fill="#777">Relaciona-se: PlanejamentoTI (q2101–q2102)</text>
  <line x1="740" y1="300" x2="740" y2="255" class="dash"/>
  <line x1="740" y1="255" x2="680" y2="255" class="dash"/>
  <line x1="680" y1="230" x2="680" y2="255" class="dash"/>

  <!-- Q4: Capacidade Institucional e SI -->
  <rect x="30" y="375" width="260" height="50" class="box" fill="#FFF8E7" stroke="#D4A017" rx="5"/>
  <text x="160" y="391" text-anchor="middle" class="quest" fill="#8B4513">Q4 — Capacidade Institucional e SI</text>
  <text x="160" y="405" text-anchor="middle" font-size="10" fill="#555">Força de trabalho, perfis e competências</text>
  <text x="160" y="417" text-anchor="middle" font-size="9" fill="#777">Relaciona-se: EstruturaSI / ProcessoSI / RiscosSI</text>
  <line x1="160" y1="375" x2="160" y2="360" class="dash"/>
  <line x1="160" y1="360" x2="680" y2="360" class="dash"/>
  <line x1="680" y1="230" x2="680" y2="360" class="dash"/>

  <!-- Q5: Gestão de Serviços de TIC -->
  <rect x="320" y="375" width="260" height="50" class="box" fill="#FFF8E7" stroke="#D4A017" rx="5"/>
  <text x="450" y="391" text-anchor="middle" class="quest" fill="#8B4513">Q5 — Gestão de Serviços de TIC</text>
  <text x="450" y="405" text-anchor="middle" font-size="10" fill="#555">Catálogo, níveis de serviço, ativos e incidentes</text>
  <text x="450" y="417" text-anchor="middle" font-size="9" fill="#777">Relaciona-se: ServicosTI (q2201–q2204)</text>
  <line x1="450" y1="375" x2="450" y2="360" class="dash"/>
  <line x1="450" y1="360" x2="680" y2="360" class="dash"/>
  <line x1="680" y1="230" x2="680" y2="360" class="dash"/>

  <!-- Q6: Contratações de TIC -->
  <rect x="610" y="375" width="260" height="50" class="box" fill="#FFF8E7" stroke="#D4A017" rx="5"/>
  <text x="740" y="391" text-anchor="middle" class="quest" fill="#8B4513">Q6 — Contratações de TIC</text>
  <text x="740" y="405" text-anchor="middle" font-size="10" fill="#555">Fluxo, papéis, aprovação técnica e alinhamento</text>
  <text x="740" y="417" text-anchor="middle" font-size="9" fill="#777">Relaciona-se: SoluçõesTI (q2601–q2602) + Planejamento</text>
  <line x1="740" y1="375" x2="740" y2="360" class="dash"/>
  <line x1="740" y1="360" x2="680" y2="360" class="dash"/>
  <line x1="680" y1="230" x2="680" y2="360" class="dash"/>

  <!-- Rodapé -->
  <text x="450" y="450" text-anchor="middle" font-size="10" fill="#555" font-style="italic">
    As seis questões de auditoria (Q1–Q6) são avaliadas com base no questionário iGovTI e nas evidências anexadas
  </text>
  <text x="450" y="465" text-anchor="middle" font-size="10" fill="#555" font-style="italic">
    para identificar achados estruturantes de governança e gestão de TIC em cada organização jurisdicionada.
  </text>
  <text x="450" y="505" text-anchor="middle" font-size="9" fill="#999">
    Fonte: estrutura de agregação do iGovTI 2026 — TCE-RJ Fiscalização 18/2026
  </text>
</svg>
