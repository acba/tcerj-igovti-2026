<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="845" viewBox="100 180 1400 845" role="img" aria-labelledby="title desc">
  <title id="title">Composição do iGovTI 2026</title>
  <desc id="desc">Estrutura do índice: dois componentes, GovernançaTI e iGestTI, este último dividido em seis dimensões de gestão, agregados por somas ponderadas até a raiz. Ao final, os quatro níveis de maturidade do índice.</desc>
  <defs>
    <!-- Soft, modern drop shadows -->
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.06"/>
    </filter>
    <filter id="shadow-sm" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0f172a" flood-opacity="0.04"/>
    </filter>

    <!-- Linear Gradients — paleta institucional (azul-marinho / verde-azulado) -->
    <linearGradient id="grad-root" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a5f"/>
      <stop offset="100%" stop-color="#0f1f38"/>
    </linearGradient>
    <linearGradient id="grad-gov" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#28486e"/>
      <stop offset="100%" stop-color="#1a2f4d"/>
    </linearGradient>
    <linearGradient id="grad-gest" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#127a70"/>
      <stop offset="100%" stop-color="#0b5c54"/>
    </linearGradient>
    <linearGradient id="grad-sub" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b4a44"/>
      <stop offset="100%" stop-color="#0e6f66"/>
    </linearGradient>

    <!-- Markers for clean tree joints -->
    <marker id="dot-blue" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6">
      <circle cx="5" cy="5" r="3" fill="#1e3a5f"/>
    </marker>
    <marker id="dot-teal" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6">
      <circle cx="5" cy="5" r="3" fill="#0e6f66"/>
    </marker>
  </defs>

  <!-- fundo removido: SVG transparente -->

  <!-- cabecalho removido: titulo, linha verde e subtitulo -->

  <!-- Typography Styling -->
  <style>
    .page-title { font-family: Arial, Helvetica, sans-serif; font-size: 34px; font-weight: 700; fill: #0f1f38; }
    .page-subtitle { font-family: Arial, Helvetica, sans-serif; font-size: 18px; fill: #51607a; }
    .node-text { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; font-weight: 700; fill: #ffffff; }
    .header-text { font-family: system-ui, -apple-system, sans-serif; font-size: 12px; font-weight: 600; fill: #ffffff; }
    .table-header { font-family: system-ui, -apple-system, sans-serif; font-size: 9px; font-weight: 700; fill: #51607a; text-transform: uppercase; letter-spacing: 0.5px; }
    .cell-id { font-family: system-ui, -apple-system, sans-serif; font-size: 9px; font-weight: 700; fill: #6b7690; }
    .cell-name { font-family: system-ui, -apple-system, sans-serif; font-size: 9px; font-weight: 500; fill: #33415a; }
    .cell-weight { font-family: system-ui, -apple-system, sans-serif; font-size: 9px; font-weight: 700; fill: #14213a; }
    .sub-title-badge { font-family: system-ui, -apple-system, sans-serif; font-size: 9px; font-weight: 700; fill: #ffffff; }
    .sub-weight-badge { font-family: system-ui, -apple-system, sans-serif; font-size: 8px; font-weight: 700; fill: #ccfbf1; }
    .nested-cell-name { font-family: system-ui, -apple-system, sans-serif; font-size: 8px; font-weight: 500; fill: #6b7690; }
    .footer-label { font-family: system-ui, -apple-system, sans-serif; font-size: 9px; font-weight: 600; fill: #51607a; }
    .maturity-title { font-family: Arial, Helvetica, sans-serif; font-size: 13px; font-weight: 700; fill: #0f1f38; letter-spacing: 0.5px; }
    .maturity-name { font-family: system-ui, -apple-system, sans-serif; font-size: 11px; font-weight: 700; }
    .maturity-range { font-family: system-ui, -apple-system, sans-serif; font-size: 9px; font-weight: 500; fill: #6b7690; }
  </style>

  <!-- Diagrama original (v6), ampliado e reposicionado sob o título -->
  <g transform="translate(30, 145) scale(1.4)">

  <!-- ===== iGovTI Root ===== -->
  <g transform="translate(440, 25)">
    <rect width="220" height="42" rx="8" fill="url(#grad-root)" filter="url(#shadow)"/>
    <text x="110" y="26" text-anchor="middle" class="node-text">iGovTI 2026</text>
  </g>

  <!-- Root Connections -->
  <path d="M 440,46 L 270,76" stroke="#cbd5e1" stroke-width="1.5" fill="none" marker-end="url(#dot-blue)"/>
  <path d="M 660,46 L 830,76" stroke="#cbd5e1" stroke-width="1.5" fill="none" marker-end="url(#dot-teal)"/>

  <!-- ==================== GOVERNANÇA DE TI ==================== -->
  <g transform="translate(100, 80)">
    <!-- Header Badge (with shadow) -->
    <rect width="320" height="38" rx="6" fill="url(#grad-gov)" filter="url(#shadow)"/>
    <text x="160" y="24" text-anchor="middle" class="header-text">Governança de TI — 47,8%</text>

    <!-- Table Container (with shadow) -->
    <rect y="44" width="320" height="152" rx="6" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" filter="url(#shadow)"/>

    <!-- Table Header -->
    <rect y="44" width="320" height="24" rx="6" fill="#f1f5f9"/>
    <text x="15" y="59" class="table-header">Questão</text>
    <text x="75" y="59" class="table-header">Descrição básica</text>
    <text x="305" y="59" class="table-header" text-anchor="end">Peso</text>
    <line x1="0" y1="68" x2="320" y2="68" stroke="#e2e8f0" stroke-width="1"/>

    <!-- Row 1: 1001 -->
    <text x="15" y="88" class="cell-id">1001</text>
    <text x="75" y="88" class="cell-name">Modelo de gestão de TI</text>
    <text x="305" y="88" class="cell-weight" text-anchor="end">32,7%</text>
    <line x1="10" y1="96" x2="310" y2="96" stroke="#f1f5f9" stroke-width="1"/>

    <!-- Row 2: 1002 -->
    <text x="15" y="114" class="cell-id">1002</text>
    <text x="75" y="114" class="cell-name">Monitoramento do desempenho</text>
    <text x="305" y="114" class="cell-weight" text-anchor="end">27,6%</text>
    <line x1="10" y1="122" x2="310" y2="122" stroke="#f1f5f9" stroke-width="1"/>

    <!-- Row 3: 1003 -->
    <text x="15" y="140" class="cell-id">1003</text>
    <text x="75" y="140" class="cell-name">Serviços de auditoria interna</text>
    <text x="305" y="140" class="cell-weight" text-anchor="end">15,4%</text>
    <line x1="10" y1="148" x2="310" y2="148" stroke="#f1f5f9" stroke-width="1"/>

    <!-- Row 4: 1004 -->
    <text x="15" y="170" class="cell-id">1004</text>
    <text x="75" y="170" class="cell-name">Simplificação de serviços públicos</text>
    <text x="305" y="170" class="cell-weight" text-anchor="end">24,3%</text>

    <!-- Description Footer -->
    <rect y="202" width="320" height="26" rx="4" fill="#eef2f6" stroke="#d7dce3" stroke-width="0.8"/>
    <text x="160" y="218" text-anchor="middle" fill="#1e3a5f" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="600">Direcionamento e controle pela alta administração</text>
  </g>


  <!-- ==================== GESTÃO DE TI (iGestTI) ==================== -->
  <g transform="translate(480, 80)">
    <!-- Header Badge (with shadow) -->
    <rect width="520" height="38" rx="6" fill="url(#grad-gest)" filter="url(#shadow)"/>
    <text x="260" y="24" text-anchor="middle" class="header-text">iGestTI — Gestão de TI — 52,2%</text>

    <!-- Main Container (with shadow) -->
    <rect y="44" width="520" height="425" rx="6" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" filter="url(#shadow)"/>

    <!-- ==================== 6 Subgrupos da Gestão ==================== -->

    <!-- SUBGRUPO 1: Planejamento de TI -->
    <g transform="translate(15, 60)" filter="url(#shadow-sm)">
      <rect width="235" height="114" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      <rect width="235" height="22" rx="6" fill="url(#grad-sub)"/>
      <text x="10" y="15" class="sub-title-badge">Planejamento de TI</text>
      <text x="225" y="15" class="sub-weight-badge" text-anchor="end">15,3%</text>

      <text x="10" y="42" class="cell-id">2101</text>
      <text x="45" y="42" class="cell-name">Processo de planejamento</text>
      <text x="225" y="42" class="cell-weight" text-anchor="end">50,2%</text>
      <line x1="8" y1="52" x2="227" y2="52" stroke="#f1f5f9" stroke-width="1"/>

      <text x="10" y="70" class="cell-id">2102</text>
      <text x="45" y="70" class="cell-name">Plano de TI (PDTI) vigente</text>
      <text x="225" y="70" class="cell-weight" text-anchor="end">49,8%</text>
      <line x1="8" y1="80" x2="227" y2="80" stroke="#f1f5f9" stroke-width="1"/>
    </g>

    <!-- SUBGRUPO 2: Gestão de Serviços -->
    <g transform="translate(270, 60)" filter="url(#shadow-sm)">
      <rect width="235" height="114" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      <rect width="235" height="22" rx="6" fill="url(#grad-sub)"/>
      <text x="10" y="15" class="sub-title-badge">Gestão de Serviços</text>
      <text x="225" y="15" class="sub-weight-badge" text-anchor="end">18,5%</text>

      <text x="10" y="40" class="cell-id">2201</text>
      <text x="45" y="40" class="cell-name">Catálogo e acordos (ANS)</text>
      <text x="225" y="40" class="cell-weight" text-anchor="end">24,4%</text>
      <line x1="8" y1="48" x2="227" y2="48" stroke="#f1f5f9" stroke-width="0.8"/>

      <text x="10" y="60" class="cell-id">2202</text>
      <text x="45" y="60" class="cell-name">Gestão de mudanças</text>
      <text x="225" y="60" class="cell-weight" text-anchor="end">24,1%</text>
      <line x1="8" y1="68" x2="227" y2="68" stroke="#f1f5f9" stroke-width="0.8"/>

      <text x="10" y="80" class="cell-id">2203</text>
      <text x="45" y="80" class="cell-name">Ativos e configuração</text>
      <text x="225" y="80" class="cell-weight" text-anchor="end">26,2%</text>
      <line x1="8" y1="88" x2="227" y2="88" stroke="#f1f5f9" stroke-width="0.8"/>

      <text x="10" y="100" class="cell-id">2204</text>
      <text x="45" y="100" class="cell-name">Gerenciamento de incidentes</text>
      <text x="225" y="100" class="cell-weight" text-anchor="end">25,3%</text>
    </g>

    <!-- SUBGRUPO 3: Riscos e Continuidade -->
    <g transform="translate(15, 190)" filter="url(#shadow-sm)">
      <rect width="235" height="114" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      <rect width="235" height="22" rx="6" fill="url(#grad-sub)"/>
      <text x="10" y="15" class="sub-title-badge">Riscos e Continuidade</text>
      <text x="225" y="15" class="sub-weight-badge" text-anchor="end">16,3%</text>

      <text x="10" y="42" class="cell-id">2301</text>
      <text x="45" y="42" class="cell-name">Riscos corporativos de TI</text>
      <text x="225" y="42" class="cell-weight" text-anchor="end">31,4%</text>
      <line x1="8" y1="52" x2="227" y2="52" stroke="#f1f5f9" stroke-width="1"/>

      <text x="10" y="70" class="cell-id">2302</text>
      <text x="45" y="70" class="cell-name">Riscos de segurança da info.</text>
      <text x="225" y="70" class="cell-weight" text-anchor="end">33,5%</text>
      <line x1="8" y1="80" x2="227" y2="80" stroke="#f1f5f9" stroke-width="1"/>

      <text x="10" y="98" class="cell-id">2303</text>
      <text x="45" y="98" class="cell-name">Plano de continuidade de TI</text>
      <text x="225" y="98" class="cell-weight" text-anchor="end">35,2%</text>
    </g>

    <!-- SUBGRUPO 4: Estrutura de Seg. da Informação -->
    <g transform="translate(270, 190)" filter="url(#shadow-sm)">
      <rect width="235" height="114" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      <rect width="235" height="22" rx="6" fill="url(#grad-sub)"/>
      <text x="10" y="15" class="sub-title-badge">Estrutura de Segurança da Info.</text>
      <text x="225" y="15" class="sub-weight-badge" text-anchor="end">15,8%</text>

      <text x="10" y="42" class="cell-id">2401</text>
      <text x="45" y="42" class="cell-name">Política de Seg. (POSIC)</text>
      <text x="225" y="42" class="cell-weight" text-anchor="end">35,3%</text>
      <line x1="8" y1="52" x2="227" y2="52" stroke="#f1f5f9" stroke-width="1"/>

      <text x="10" y="70" class="cell-id">2402</text>
      <text x="45" y="70" class="cell-name">Comitê de segurança</text>
      <text x="225" y="70" class="cell-weight" text-anchor="end">31,4%</text>
      <line x1="8" y1="80" x2="227" y2="80" stroke="#f1f5f9" stroke-width="1"/>

      <text x="10" y="98" class="cell-id">2403</text>
      <text x="45" y="98" class="cell-name">Gestor de Segurança nomeado</text>
      <text x="225" y="98" class="cell-weight" text-anchor="end">33,3%</text>
    </g>

    <!-- SUBGRUPO 5: Processos de Segurança (TCU-alinhado) -->
    <g transform="translate(15, 320)" filter="url(#shadow-sm)">
      <rect width="235" height="128" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      <rect width="235" height="22" rx="6" fill="url(#grad-sub)"/>
      <text x="10" y="15" class="sub-title-badge">Processos de Segurança da Info.</text>
      <text x="225" y="15" class="sub-weight-badge" text-anchor="end">18,2%</text>

      <!-- TCU Combined Node: 2501 and 2502 under _q4251 (37.6%) -->
      <text x="10" y="40" class="cell-id" fill="#0e6f66">2501/2</text>
      <text x="50" y="40" class="cell-name" font-weight="700" fill="#0b5c54">Ativos/Acesso (TCU)</text>
      <text x="225" y="40" class="cell-weight" fill="#0b5c54" text-anchor="end">37,6%</text>

      <!-- Sub-nesting for mathematically correct TCU breakdown -->
      <text x="25" y="52" class="nested-cell-name">└─ 2501 Gestão de ativos (16,7%*)</text>
      <text x="25" y="64" class="nested-cell-name">└─ 2502 Controle de acesso (83,3%*)</text>
      <line x1="8" y1="72" x2="227" y2="72" stroke="#f1f5f9" stroke-width="0.8"/>

      <text x="10" y="86" class="cell-id">2503</text>
      <text x="50" y="86" class="cell-name">Classificação de informações</text>
      <text x="225" y="86" class="cell-weight" text-anchor="end">30,1%</text>
      <line x1="8" y1="96" x2="227" y2="96" stroke="#f1f5f9" stroke-width="0.8"/>

      <text x="10" y="110" class="cell-id">2504</text>
      <text x="50" y="110" class="cell-name">Recursos e nuvem</text>
      <text x="225" y="110" class="cell-weight" text-anchor="end">32,3%</text>
    </g>

    <!-- SUBGRUPO 6: Gestão de Soluções -->
    <g transform="translate(270, 320)" filter="url(#shadow-sm)">
      <rect width="235" height="114" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      <rect width="235" height="22" rx="6" fill="url(#grad-sub)"/>
      <text x="10" y="15" class="sub-title-badge">Gestão de Soluções de TI</text>
      <text x="225" y="15" class="sub-weight-badge" text-anchor="end">15,8%</text>

      <text x="10" y="42" class="cell-id">2601</text>
      <text x="45" y="42" class="cell-name">Processo e ciclo de software</text>
      <text x="225" y="42" class="cell-weight" text-anchor="end">50,9%</text>
      <line x1="8" y1="52" x2="227" y2="52" stroke="#f1f5f9" stroke-width="1"/>

      <text x="10" y="70" class="cell-id">2602</text>
      <text x="45" y="70" class="cell-name">Gestão de projetos de TI</text>
      <text x="225" y="70" class="cell-weight" text-anchor="end">49,1%</text>
    </g>

    <!-- Footer label -->
    <text x="260" y="460" text-anchor="middle" class="footer-label" fill="#0e6f66">iGestTI: 6 dimensões operacionais • 20 questões principais ponderadas</text>
  </g>

  <!-- ==================== MATURITY LEVELS SECTION ==================== -->
  <g transform="translate(0, 550)">
    <line x1="50" y1="5" x2="1050" y2="5" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="3 3"/>
    <text x="550" y="24" text-anchor="middle" class="maturity-title">Níveis de Maturidade do iGovTI 2026</text>

    <!-- Maturity Bar -->
    <g transform="translate(100, 36)" filter="url(#shadow-sm)">
      <!-- Level 1: Inexpressivo -->
      <rect x="0" y="0" width="220" height="42" rx="6" fill="#fff" stroke="#b3261e" stroke-width="1.8"/>
      <rect x="0" y="0" width="6" height="42" rx="2" fill="#b3261e"/>
      <text x="20" y="20" class="maturity-name" fill="#b3261e">Inexpressivo</text>
      <text x="20" y="32" class="maturity-range">[0,00 ; 0,15)</text>

      <!-- Level 2: Iniciando -->
      <rect x="230" y="0" width="220" height="42" rx="6" fill="#fff" stroke="#b5651d" stroke-width="1.8"/>
      <rect x="230" y="0" width="6" height="42" rx="2" fill="#b5651d"/>
      <text x="250" y="20" class="maturity-name" fill="#a15414">Iniciando</text>
      <text x="250" y="32" class="maturity-range">[0,15 ; 0,40)</text>

      <!-- Level 3: Intermediário -->
      <rect x="460" y="0" width="220" height="42" rx="6" fill="#fff" stroke="#7a8a23" stroke-width="1.8"/>
      <rect x="460" y="0" width="6" height="42" rx="2" fill="#7a8a23"/>
      <text x="480" y="20" class="maturity-name" fill="#5f6c1b">Intermediário</text>
      <text x="480" y="32" class="maturity-range">[0,40 ; 0,70)</text>

      <!-- Level 4: Aprimorado -->
      <rect x="690" y="0" width="220" height="42" rx="6" fill="#fff" stroke="#1f7a4d" stroke-width="1.8"/>
      <rect x="690" y="0" width="6" height="42" rx="2" fill="#1f7a4d"/>
      <text x="710" y="20" class="maturity-name" fill="#1f7a4d">Aprimorado</text>
      <text x="710" y="32" class="maturity-range">[0,70 ; 1,00]</text>
    </g>
  </g>
  </g>
</svg>
