<svg xmlns="http://www.w3.org/2000/svg" width="2600" height="1050" viewBox="0 0 2600 1050" role="img" aria-labelledby="title desc">
  <title id="title">Fluxo metodologico da fiscalizacao iGovTI 2026</title>
  <desc id="desc">Diagrama em sete etapas: planejamento do instrumento, coleta eletronica, base valida, saneamento e evidencias, calculo do iGovTI, execucao da auditoria, relatorios e consolidacao.</desc>
  <defs>
    <style>
      .bg { fill: #f8fafc; }
      .title { fill: #1f2937; font: 700 54px Arial, sans-serif; }
      .subtitle { fill: #475569; font: 400 28px Arial, sans-serif; }
      .phase { fill: #334155; font: 700 22px Arial, sans-serif; letter-spacing: .8px; }
      .card { fill: #ffffff; stroke: #cbd5e1; stroke-width: 3; }
      .card-top-1 { fill: #0f766e; }
      .card-top-2 { fill: #1d4ed8; }
      .card-top-3 { fill: #7c3aed; }
      .card-top-4 { fill: #b45309; }
      .step-num { fill: #ffffff; font: 700 30px Arial, sans-serif; }
      .step-title { fill: #111827; font: 700 25px Arial, sans-serif; }
      .step-text { fill: #334155; font: 400 22px Arial, sans-serif; }
      .connector { stroke: #94a3b8; stroke-width: 6; fill: none; stroke-linecap: round; stroke-linejoin: round; }
      .connector-dot { fill: #94a3b8; }
      .note { fill: #0f172a; font: 700 24px Arial, sans-serif; }
      .note-small { fill: #475569; font: 400 20px Arial, sans-serif; }
      .pill { fill: #ecfdf5; stroke: #14b8a6; stroke-width: 2; }
    </style>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#0f172a" flood-opacity=".12"/>
    </filter>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M2,1 L11,6 L2,11 Z" fill="#94a3b8"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="2600" height="1050"/>

  <text class="title" x="120" y="105">Fluxo metodológico da fiscalização iGovTI 2026</text>
  <text class="subtitle" x="120" y="153">Da elaboração do questionário à consolidação dos achados e resultados do relatório</text>

  <rect class="pill" x="1710" y="78" width="570" height="86" rx="18"/>
  <text class="note" x="1740" y="114">120 jurisdicionados no escopo</text>
  <text class="note-small" x="1740" y="146">114 avaliados com resposta válida; 6 não respondentes</text>

  <text class="phase" x="142" y="224">PLANEJAR</text>
  <text class="phase" x="494" y="224">COLETAR</text>
  <text class="phase" x="843" y="224">DELIMITAR</text>
  <text class="phase" x="1198" y="224">VALIDAR</text>
  <text class="phase" x="1545" y="224">CALCULAR</text>
  <text class="phase" x="1897" y="224">AUDITAR</text>
  <text class="phase" x="2363" y="224" text-anchor="middle">RELATAR</text>

  <path class="connector" marker-end="url(#arrow)" d="M392 448 H454"/>
  <path class="connector" marker-end="url(#arrow)" d="M744 448 H806"/>
  <path class="connector" marker-end="url(#arrow)" d="M1096 448 H1158"/>
  <path class="connector" marker-end="url(#arrow)" d="M1448 448 H1510"/>
  <path class="connector" marker-end="url(#arrow)" d="M1800 448 H1862"/>
  <path class="connector" marker-end="url(#arrow)" d="M2152 448 H2214"/>

  <g filter="url(#shadow)">
    <rect class="card" x="110" y="270" width="282" height="410" rx="18"/>
    <rect class="card-top-1" x="110" y="270" width="282" height="72" rx="18"/>
    <rect class="card-top-1" x="110" y="318" width="282" height="24"/>
    <circle cx="154" cy="306" r="25" fill="#0b4f4a"/>
    <text class="step-num" x="154" y="317" text-anchor="middle">1</text>
    <text class="step-title" x="137" y="390">Planejamento</text>
    <text class="step-title" x="137" y="421">do instrumento</text>
    <text class="step-text" x="137" y="480">Questionário estruturado</text>
    <text class="step-text" x="137" y="514">com base no iGovTI</text>
    <text class="step-text" x="137" y="548">TCU 2021 e 2024.</text>
    <text class="step-text" x="137" y="602">Adaptação ao contexto</text>
    <text class="step-text" x="137" y="636">dos jurisdicionados.</text>
  </g>

  <g filter="url(#shadow)">
    <rect class="card" x="462" y="270" width="282" height="410" rx="18"/>
    <rect class="card-top-2" x="462" y="270" width="282" height="72" rx="18"/>
    <rect class="card-top-2" x="462" y="318" width="282" height="24"/>
    <circle cx="506" cy="306" r="25" fill="#1e3a8a"/>
    <text class="step-num" x="506" y="317" text-anchor="middle">2</text>
    <text class="step-title" x="489" y="390">Coleta</text>
    <text class="step-title" x="489" y="421">eletrônica</text>
    <text class="step-text" x="489" y="480">Questionário no</text>
    <text class="step-text" x="489" y="514">LimeSurvey.</text>
    <text class="step-text" x="489" y="568">Links individualizados</text>
    <text class="step-text" x="489" y="602">para cada organização.</text>
    <text class="step-text" x="489" y="656">Práticas e documentos.</text>
  </g>

  <g filter="url(#shadow)">
    <rect class="card" x="814" y="270" width="282" height="410" rx="18"/>
    <rect class="card-top-2" x="814" y="270" width="282" height="72" rx="18"/>
    <rect class="card-top-2" x="814" y="318" width="282" height="24"/>
    <circle cx="858" cy="306" r="25" fill="#1e3a8a"/>
    <text class="step-num" x="858" y="317" text-anchor="middle">3</text>
    <text class="step-title" x="841" y="390">Base válida</text>
    <text class="step-title" x="841" y="421">de análise</text>
    <text class="step-text" x="841" y="480">120 organizações</text>
    <text class="step-text" x="841" y="514">no escopo.</text>
    <text class="step-text" x="841" y="568">114 respostas válidas</text>
    <text class="step-text" x="841" y="602">e 6 não respondentes.</text>
  </g>

  <g filter="url(#shadow)">
    <rect class="card" x="1166" y="270" width="282" height="410" rx="18"/>
    <rect class="card-top-3" x="1166" y="270" width="282" height="72" rx="18"/>
    <rect class="card-top-3" x="1166" y="318" width="282" height="24"/>
    <circle cx="1210" cy="306" r="25" fill="#581c87"/>
    <text class="step-num" x="1210" y="317" text-anchor="middle">4</text>
    <text class="step-title" x="1193" y="390">Saneamento</text>
    <text class="step-title" x="1193" y="421">e evidências</text>
    <text class="step-text" x="1193" y="480">Retificações e</text>
    <text class="step-text" x="1193" y="514">correções da base.</text>
    <text class="step-text" x="1193" y="568">Confronto documental</text>
    <text class="step-text" x="1193" y="602">e ajustes das respostas.</text>
  </g>

  <g filter="url(#shadow)">
    <rect class="card" x="1518" y="270" width="282" height="410" rx="18"/>
    <rect class="card-top-3" x="1518" y="270" width="282" height="72" rx="18"/>
    <rect class="card-top-3" x="1518" y="318" width="282" height="24"/>
    <circle cx="1562" cy="306" r="25" fill="#581c87"/>
    <text class="step-num" x="1562" y="317" text-anchor="middle">5</text>
    <text class="step-title" x="1545" y="390">Cálculo</text>
    <text class="step-title" x="1545" y="421">do iGovTI</text>
    <text class="step-text" x="1545" y="480">Respostas convertidas</text>
    <text class="step-text" x="1545" y="514">em notas de 0 a 1.</text>
    <text class="step-text" x="1545" y="568">Agregação ponderada</text>
    <text class="step-text" x="1545" y="602">e níveis de maturidade.</text>
  </g>

  <g filter="url(#shadow)">
    <rect class="card" x="1870" y="270" width="282" height="410" rx="18"/>
    <rect class="card-top-4" x="1870" y="270" width="282" height="72" rx="18"/>
    <rect class="card-top-4" x="1870" y="318" width="282" height="24"/>
    <circle cx="1914" cy="306" r="25" fill="#7c2d12"/>
    <text class="step-num" x="1914" y="317" text-anchor="middle">6</text>
    <text class="step-title" x="1897" y="390">Procedimentos</text>
    <text class="step-title" x="1897" y="421">de auditoria</text>
    <text class="step-text" x="1897" y="480">Cruzamento de bases,</text>
    <text class="step-text" x="1897" y="514">respostas ajustadas e</text>
    <text class="step-text" x="1897" y="548">verificações.</text>
    <text class="step-text" x="1897" y="602">Achados e situações.</text>
  </g>

  <g filter="url(#shadow)">
    <rect class="card" x="2222" y="270" width="282" height="410" rx="18"/>
    <rect class="card-top-4" x="2222" y="270" width="282" height="72" rx="18"/>
    <rect class="card-top-4" x="2222" y="318" width="282" height="24"/>
    <circle cx="2266" cy="306" r="25" fill="#7c2d12"/>
    <text class="step-num" x="2266" y="317" text-anchor="middle">7</text>
    <text class="step-title" x="2249" y="390">Relatórios</text>
    <text class="step-title" x="2249" y="421">e consolidação</text>
    <text class="step-text" x="2249" y="480">Relatórios individuais,</text>
    <text class="step-text" x="2249" y="514">manifestações dos</text>
    <text class="step-text" x="2249" y="548">gestores e relatório</text>
    <text class="step-text" x="2249" y="582">consolidado.</text>
  </g>

  <path class="connector" d="M250 700 C470 804 685 804 950 704"/>
  <circle class="connector-dot" cx="250" cy="700" r="8"/>
  <circle class="connector-dot" cx="950" cy="704" r="8"/>
  <text class="note-small" x="600" y="805" text-anchor="middle">coleta e delimitação do universo avaliado</text>

  <path class="connector" d="M1307 700 C1490 802 1685 802 2010 704"/>
  <circle class="connector-dot" cx="1307" cy="700" r="8"/>
  <circle class="connector-dot" cx="2010" cy="704" r="8"/>
  <text class="note-small" x="1658" y="805" text-anchor="middle">validação documental, cálculo do índice e achados</text>

  <rect x="120" y="872" width="2360" height="88" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text class="note" x="154" y="910">Resultado metodológico:</text>
  <text class="note-small" x="154" y="942">diagnóstico quantitativo de maturidade, comparação longitudinal com 2023 e achados de auditoria fundamentados nas respostas e evidências analisadas.</text>
</svg>
