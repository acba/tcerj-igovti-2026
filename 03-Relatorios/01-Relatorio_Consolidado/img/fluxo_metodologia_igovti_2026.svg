<svg xmlns="http://www.w3.org/2000/svg" width="1444" height="1606" viewBox="78 110 1444 1606" role="img" aria-labelledby="title desc">
  <title id="title">Fluxo metodológico da fiscalização iGovTI 2026</title>
  <desc id="desc">Fluxo em nove etapas, do planejamento aos relatórios finais. O universo abrange 119 organizações: 113 respondentes e 6 não respondentes.</desc>
  <defs>
    <style>
      .bg { /* removido */ }
      .title { fill: #0f1f38; font: 700 47px Arial, sans-serif; }
      .subtitle { fill: #51607a; font: 400 27px Arial, sans-serif; }
      .title-rule { stroke: #0e6f66; stroke-width: 4; }
      .summary-number { fill: #0e6f66; font: 700 43px Arial, sans-serif; }
      .summary-label { fill: #33415a; font: 400 22px Arial, sans-serif; letter-spacing: .3px; }
      .summary-rule { stroke: #d7dce3; stroke-width: 2; }
      .phase { fill: #51607a; font: 700 20px Arial, sans-serif; letter-spacing: 2px; }
      .phase-rule { stroke: #d7dce3; stroke-width: 2; }
      .card { fill: #ffffff; stroke: #d7dce3; stroke-width: 2; }
      .top-bar { fill: #1e3a5f; }
      .badge { fill: #14283f; }
      .badge-ring { fill: none; stroke: #3a5578; stroke-width: 1.5; }
      .step-num { fill: #ffffff; font: 700 27px Arial, sans-serif; }
      .step-title { fill: #14213a; font: 700 30px Arial, sans-serif; }
      .step-text { fill: #3d4a63; font: 400 24px Arial, sans-serif; }
      .step-strong { fill: #0e6f66; font: 700 24px Arial, sans-serif; }
      .connector { stroke: #a7afbe; stroke-width: 5; fill: none; stroke-linecap: round; stroke-linejoin: round; }
      .footer-title { fill: #0f1f38; font: 700 25px Arial, sans-serif; }
      .footer-text { fill: #51607a; font: 400 23px Arial, sans-serif; }
      .footer-band { fill: #0e6f66; }
    </style>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#0f1f38" flood-opacity=".10"/>
    </filter>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto">
      <path d="M2,1 L11,6 L2,11 Z" fill="#a7afbe"/>
    </marker>
  </defs>

  <!-- fundo removido: SVG transparente -->

  <!-- cabecalho removido: titulo e linha verde -->

  <text class="subtitle" x="80" y="130">Da autoavaliação ao contraditório e aos produtos finais da auditoria</text>

  <g aria-label="Resumo do universo fiscalizado">
    <rect x="80" y="168" width="1440" height="126" rx="14" fill="#ffffff" stroke="#d7dce3" stroke-width="2"/>
    <text class="summary-number" x="320" y="222" text-anchor="middle">119</text>
    <text class="summary-label" x="320" y="258" text-anchor="middle">organizações no escopo</text>
    <line class="summary-rule" x1="560" y1="192" x2="560" y2="270"/>
    <text class="summary-number" x="800" y="222" text-anchor="middle">113</text>
    <text class="summary-label" x="800" y="258" text-anchor="middle">respondentes</text>
    <line class="summary-rule" x1="1040" y1="192" x2="1040" y2="270"/>
    <text class="summary-number" x="1280" y="222" text-anchor="middle">6</text>
    <text class="summary-label" x="1280" y="258" text-anchor="middle">não respondentes</text>
  </g>

  <!-- Fluxo em S: 1→3, 4→6 e 7→9. Proporção pensada para página A4 vertical. -->
  <text class="phase" x="584" y="344">PREPARAÇÃO E COLETA</text>
  <line class="phase-rule" x1="92" y1="356" x2="1520" y2="356"/>
  <text class="phase" x="584" y="803">ANÁLISE E RESULTADOS PRELIMINARES</text>
  <line class="phase-rule" x1="92" y1="815" x2="1520" y2="815"/>
  <text class="phase" x="584" y="1262">CONTRADITÓRIO E RESULTADOS FINAIS</text>
  <line class="phase-rule" x1="92" y1="1274" x2="1520" y2="1274"/>

  <path class="connector" marker-end="url(#arrow)" d="M512 568 H572"/>
  <path class="connector" marker-end="url(#arrow)" d="M1028 568 H1088"/>
  <path class="connector" marker-end="url(#arrow)" d="M1304 750 V829"/>
  <path class="connector" marker-end="url(#arrow)" d="M1088 1027 H1028"/>
  <path class="connector" marker-end="url(#arrow)" d="M572 1027 H512"/>
  <path class="connector" marker-end="url(#arrow)" d="M296 1209 V1288"/>
  <path class="connector" marker-end="url(#arrow)" d="M512 1486 H572"/>
  <path class="connector" marker-end="url(#arrow)" d="M1028 1486 H1088"/>

  <g filter="url(#shadow)">
    <rect class="card" x="80" y="382" width="432" height="368" rx="14"/>
    <path class="top-bar" d="M92 382 H500 A12 12 0 0 1 512 394 V454 H80 V394 A12 12 0 0 1 92 382 Z"/>
    <circle class="badge" cx="126" cy="418" r="25"/>
    <circle class="badge-ring" cx="126" cy="418" r="30"/>
    <text class="step-num" x="126" y="428" text-anchor="middle">1</text>
    <text class="step-title" x="108" y="510">Planejamento</text>
    <text class="step-title" x="108" y="548">do instrumento</text>
    <text class="step-text" x="108" y="605">Questionário estruturado</text>
    <text class="step-text" x="108" y="640">e adaptado ao contexto</text>
    <text class="step-text" x="108" y="675">dos jurisdicionados.</text>
  </g>

  <g filter="url(#shadow)">
    <rect class="card" x="584" y="382" width="432" height="368" rx="14"/>
    <path class="top-bar" d="M596 382 H1004 A12 12 0 0 1 1016 394 V454 H584 V394 A12 12 0 0 1 596 382 Z"/>
    <circle class="badge" cx="630" cy="418" r="25"/>
    <circle class="badge-ring" cx="630" cy="418" r="30"/>
    <text class="step-num" x="630" y="428" text-anchor="middle">2</text>
    <text class="step-title" x="612" y="510">Coleta eletrônica</text>
    <text class="step-text" x="612" y="570">Questionário no LimeSurvey,</text>
    <text class="step-text" x="612" y="605">com links individualizados</text>
    <text class="step-text" x="612" y="640">e envio de documentos.</text>
  </g>

  <g filter="url(#shadow)">
    <rect class="card" x="1088" y="382" width="432" height="368" rx="14"/>
    <path class="top-bar" d="M1100 382 H1508 A12 12 0 0 1 1520 394 V454 H1088 V394 A12 12 0 0 1 1100 382 Z"/>
    <circle class="badge" cx="1134" cy="418" r="25"/>
    <circle class="badge-ring" cx="1134" cy="418" r="30"/>
    <text class="step-num" x="1134" y="428" text-anchor="middle">3</text>
    <text class="step-title" x="1116" y="510">Universo analisado</text>
    <text class="step-strong" x="1116" y="570">113 respostas válidas</text>
    <text class="step-text" x="1116" y="605">integraram o iGovTI e os</text>
    <text class="step-text" x="1116" y="640">achados consolidados.</text>
    <text class="step-text" x="1116" y="692">6 não respondentes.</text>
  </g>

  <g filter="url(#shadow)">
    <rect class="card" x="1088" y="841" width="432" height="368" rx="14"/>
    <path class="top-bar" d="M1100 841 H1508 A12 12 0 0 1 1520 853 V913 H1088 V853 A12 12 0 0 1 1100 841 Z"/>
    <circle class="badge" cx="1134" cy="877" r="25"/>
    <circle class="badge-ring" cx="1134" cy="877" r="30"/>
    <text class="step-num" x="1134" y="887" text-anchor="middle">4</text>
    <text class="step-title" x="1116" y="969">Saneamento</text>
    <text class="step-title" x="1116" y="1007">e evidências</text>
    <text class="step-text" x="1116" y="1064">Retificações, correções</text>
    <text class="step-text" x="1116" y="1099">e análise documental</text>
    <text class="step-text" x="1116" y="1134">das práticas declaradas.</text>
  </g>

  <g filter="url(#shadow)">
    <rect class="card" x="584" y="841" width="432" height="368" rx="14"/>
    <path class="top-bar" d="M596 841 H1004 A12 12 0 0 1 1016 853 V913 H584 V853 A12 12 0 0 1 596 841 Z"/>
    <circle class="badge" cx="630" cy="877" r="25"/>
    <circle class="badge-ring" cx="630" cy="877" r="30"/>
    <text class="step-num" x="630" y="887" text-anchor="middle">5</text>
    <text class="step-title" x="612" y="969">Cálculo e auditoria</text>
    <text class="step-text" x="612" y="1029">Cálculo do iGovTI e execução</text>
    <text class="step-text" x="612" y="1064">dos procedimentos sobre a</text>
    <text class="step-text" x="612" y="1099"> base pós-avaliação de evidências.</text>
    <text class="step-strong" x="612" y="1151">Achados preliminares.</text>
  </g>

  <g filter="url(#shadow)">
    <rect class="card" x="80" y="841" width="432" height="368" rx="14"/>
    <path class="top-bar" d="M92 841 H500 A12 12 0 0 1 512 853 V913 H80 V853 A12 12 0 0 1 92 841 Z"/>
    <circle class="badge" cx="126" cy="877" r="25"/>
    <circle class="badge-ring" cx="126" cy="877" r="30"/>
    <text class="step-num" x="126" y="887" text-anchor="middle">6</text>
    <text class="step-title" x="108" y="969">Relatórios individuais</text>
    <text class="step-title" x="108" y="1007">preliminares</text>
    <text class="step-text" x="108" y="1064">iGovTI, achados, situações</text>
    <text class="step-text" x="108" y="1099">encontradas e propostas</text>
    <text class="step-text" x="108" y="1134">de encaminhamento.</text>
  </g>

  <g filter="url(#shadow)">
    <rect class="card" x="80" y="1300" width="432" height="328" rx="14"/>
    <path class="top-bar" d="M92 1300 H500 A12 12 0 0 1 512 1312 V1372 H80 V1312 A12 12 0 0 1 92 1300 Z"/>
    <circle class="badge" cx="126" cy="1336" r="25"/>
    <circle class="badge-ring" cx="126" cy="1336" r="30"/>
    <text class="step-num" x="126" y="1346" text-anchor="middle">7</text>
    <text class="step-title" x="108" y="1428">Comentários</text>
    <text class="step-title" x="108" y="1466">dos gestores</text>
    <text class="step-text" x="108" y="1523">Manifestações, correções</text>
    <text class="step-text" x="108" y="1558">e evidências adicionais.</text>
  </g>

  <g filter="url(#shadow)">
    <rect class="card" x="584" y="1300" width="432" height="328" rx="14"/>
    <path class="top-bar" d="M596 1300 H1004 A12 12 0 0 1 1016 1312 V1372 H584 V1312 A12 12 0 0 1 596 1300 Z"/>
    <circle class="badge" cx="630" cy="1336" r="25"/>
    <circle class="badge-ring" cx="630" cy="1336" r="30"/>
    <text class="step-num" x="630" y="1346" text-anchor="middle">8</text>
    <text class="step-title" x="612" y="1428">Reavaliação final</text>
    <text class="step-text" x="612" y="1488">Apreciação das manifestações,</text>
    <text class="step-text" x="612" y="1523">ajuste das respostas, recálculo</text>
    <text class="step-text" x="612" y="1558">e reexecução da auditoria.</text>
  </g>

  <g filter="url(#shadow)">
    <rect class="card" x="1088" y="1300" width="432" height="328" rx="14"/>
    <path class="top-bar" d="M1100 1300 H1508 A12 12 0 0 1 1520 1312 V1372 H1088 V1312 A12 12 0 0 1 1100 1300 Z"/>
    <circle class="badge" cx="1134" cy="1336" r="25"/>
    <circle class="badge-ring" cx="1134" cy="1336" r="30"/>
    <text class="step-num" x="1134" y="1346" text-anchor="middle">9</text>
    <text class="step-title" x="1116" y="1428">Relatórios finais</text>
    <text class="step-text" x="1116" y="1488">Relatório consolidado final e</text>
    <text class="step-text" x="1116" y="1523">relatórios individuais finais,</text>
    <text class="step-text" x="1116" y="1558">com conclusões e</text>
    <text class="step-text" x="1116" y="1593">encaminhamentos.</text>
  </g>

  <g aria-label="Resultado metodológico">
    <rect x="80" y="1662" width="1440" height="54" rx="10" fill="#ffffff" stroke="#d7dce3" stroke-width="2"/>
    <rect class="footer-band" x="80" y="1662" width="6" height="54" rx="0"/>
    <text class="footer-title" x="108" y="1697">Resultado:</text>
    <text class="footer-text" x="245" y="1697">iGovTI e achados finais fundamentados nas respostas, evidências e manifestações analisadas.</text>
  </g>
</svg>